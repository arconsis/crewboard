# The workspace: the binary `crewboard` (this package) and the library crates under `crates/`.
# A plain `cargo test`, `cargo clippy` or `cargo doc` at the root covers every member
# (`default-members`); CI also passes `--workspace`.
[workspace]
members = [".", "crates/crewboard-protocol", "crates/host-lock"]
default-members = [".", "crates/crewboard-protocol", "crates/host-lock"]
resolver = "3"

# Every crate shares this version. `build.yml` and `scripts/maintainer/release-macos.sh` read the
# first line that starts with `version = `, so this line must stay the first one.
[workspace.package]
version = "0.8.2"
edition = "2024"
rust-version = "1.89"
repository = "https://github.com/arconsis/crewboard"
license = "Apache-2.0"
publish = false
authors = ["arconsis IT-Solutions GmbH"]

[workspace.dependencies]
crewboard-protocol = { path = "crates/crewboard-protocol" }
host-lock = { path = "crates/host-lock" }
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
libc = "0.2.190"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
ssh-key = { version = "0.6.7", features = ["ed25519", "std", "rand_core", "getrandom"] }
tar = { version = "0.4", default-features = false }
tempfile = "3.27.0"
toml = "1.1.8"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
# Thresholds and the disallowed calls are in clippy.toml.
disallowed_methods = "warn"
let_underscore_must_use = "warn"
unwrap_used = "warn"
expect_used = "warn"
too_many_lines = "warn"

[package]
name = "crewboard"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Coordinate AI agents as a crew through a GitHub Project board and signed issue comments."
repository.workspace = true
readme = "README.md"
license.workspace = true
publish.workspace = true
authors.workspace = true
keywords = ["ai-agents", "github-projects", "cli", "coordination", "automation"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
base64.workspace = true
clap.workspace = true
crewboard-protocol.workspace = true
host-lock.workspace = true
flate2.workspace = true
regex.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
ssh-key.workspace = true
tar.workspace = true
toml.workspace = true

# Signals, process groups and the terminal of the wake, `repeat` and `agent token`; std has no
# call for them.
[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
# `clock::FakeClock` for the unit tests of ops and wake.
host-lock = { workspace = true, features = ["test-support"] }
tempfile.workspace = true

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[lints]
workspace = true
