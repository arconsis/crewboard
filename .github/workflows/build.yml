name: build

# Release builds of crewboard for one commit. They run for every commit on main, and the release
# workflow calls them for a version tag, so a deployment downloads the binaries of a commit and
# does not build on each machine. The result is one artifact, `crewboard-build` (30 days):
#
#   crewboard-<version>-<target>.tar.gz   the binary, README.md, LICENSE, NOTICE and
#                                         THIRD-PARTY-LICENSES.md
#   SHA256SUMS                            the sha256 of each tarball (sha256sum format)
#   COMMIT                                the full sha of the built commit
#
# Linux targets build on GitHub-hosted runners. The macOS targets build on one Apple Silicon
# runner: the GitHub-hosted `macos-15` in the public repository, a self-hosted macOS runner in a
# private fork or mirror. A build of a push or a tag needs all four tarballs. A pull request that
# changes the build runs the Linux jobs only.

on:
  push:
    branches: [main]
  workflow_call:
    inputs:
      ref:
        description: "The ref to build: a tag, a branch or a sha"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      ref:
        description: "The ref to build (default: the selected ref)"
        required: false
        type: string
  # Only a change of the build itself starts a build for a pull request.
  pull_request:
    paths:
      - ".github/workflows/build.yml"
      - ".github/workflows/release.yml"

permissions:
  contents: read

# One run per ref or sha. A second run of the same one is queued. Nothing is cancelled: the build
# of every main commit must finish. A tag build and a main build of one commit are two groups and
# build twice.
concurrency:
  group: build-${{ inputs.ref || github.sha }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  # Resolves the ref to one commit, so every job builds the same commit even if a branch moves.
  resolve:
    name: resolve the commit
    runs-on: ubuntu-22.04
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
      version: ${{ steps.sha.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A pull request builds its own head commit, not the synthetic merge commit.
          ref: ${{ inputs.ref || github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - id: sha
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          [ -n "$version" ] || { echo "::error::no version in Cargo.toml"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

  # Native runners, one per target: each build runs its own binary for the version check, and no
  # cross toolchain is needed for the C code of aws-lc-sys. Ubuntu 22.04 means glibc 2.35.
  linux:
    name: build ${{ matrix.target }}
    needs: [resolve]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            arch: "x86-64"
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            arch: "aarch64"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - name: Install stable toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustc -V
      - name: Read the version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          [ -n "$version" ] || { echo "::error::no version in Cargo.toml"; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"
      # No build cache: a release binary is built from the commit alone.
      - name: Build
        run: cargo build --release --locked
      - name: Check the version and the architecture
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          bin=target/release/crewboard
          out=$("$bin" --version)
          echo "$out"
          [ "$out" = "crewboard $VERSION" ] || { echo "::error::'$bin --version' prints '$out', expected 'crewboard $VERSION'"; exit 1; }
          file "$bin"
          file "$bin" | grep -q "$ARCH" || { echo "::error::$bin is not a $ARCH binary"; exit 1; }
      - name: Package
        env:
          TARGET: ${{ matrix.target }}
        run: |
          name="crewboard-$VERSION-$TARGET"
          mkdir -p "dist/$name"
          cp target/release/crewboard "dist/$name/"
          # The list is fixed. A missing file stops the build, so no tarball lacks a license file.
          for f in README.md LICENSE NOTICE THIRD-PARTY-LICENSES.md; do
            [ -f "$f" ] || { echo "::error::$f is missing: a tarball needs README.md, LICENSE, NOTICE and THIRD-PARTY-LICENSES.md"; exit 1; }
            cp "$f" "dist/$name/"
          done
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          tar -tzf "dist/$name.tar.gz"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bin-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  # One job for both repositories. The public repository uses the GitHub-hosted runner. A private
  # fork or mirror uses its own self-hosted macOS runner, because hosted macOS minutes cost money
  # there. Never for a pull request: a self-hosted runner would run the code of the PR.
  # `environment` lets the owner restrict the deployment branches to main and v* tags in the
  # repository settings (docs/guides/install.md), which a workflow edit cannot remove. This
  # matters most for the self-hosted runner. The name is the same in both cases, so the job never
  # depends on an expression that may evaluate to an empty environment.
  # A self-hosted runner keeps its state: the build uses a clean target dir under RUNNER_TEMP and
  # removes it at the end. One Apple Silicon runner builds both targets; it runs the binary of its
  # own arch only.
  macos:
    name: build ${{ matrix.target }}
    needs: [resolve]
    if: github.event_name != 'pull_request'
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted","macOS"]') || 'macos-15' }}
    environment: macos-build
    # A hang during the build. A job that queues without a runner is not limited by this.
    timeout-minutes: 45
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: aarch64-apple-darwin
            arch: "arm64"
          - target: x86_64-apple-darwin
            arch: "x86_64"
    steps:
      - name: Choose a clean target dir
        env:
          TARGET: ${{ matrix.target }}
        run: echo "CARGO_TARGET_DIR=$RUNNER_TEMP/crewboard-target-$TARGET-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
          clean: true
      - name: Read the version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          [ -n "$version" ] || { echo "::error::no version in Cargo.toml"; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"
      # The same compiler as the Linux jobs (stable), without a change of the runner default.
      - name: Build
        env:
          TARGET: ${{ matrix.target }}
        run: |
          rm -rf "$CARGO_TARGET_DIR"
          rustup toolchain install stable --profile minimal --target "$TARGET"
          cargo +stable -V
          rustc +stable -V
          cargo +stable build --release --locked --target "$TARGET"
      - name: Check the version and the architecture
        env:
          TARGET: ${{ matrix.target }}
          ARCH: ${{ matrix.arch }}
        run: |
          bin="$CARGO_TARGET_DIR/$TARGET/release/crewboard"
          file "$bin"
          file "$bin" | grep -q "$ARCH" || { echo "::error::$bin is not a $ARCH binary"; exit 1; }
          lipo -archs "$bin" | grep -qx "$ARCH" || { echo "::error::lipo says '$(lipo -archs "$bin")', expected $ARCH"; exit 1; }
          if [ "$(uname -m)" = "$ARCH" ]; then
            out=$("$bin" --version)
            echo "$out"
            [ "$out" = "crewboard $VERSION" ] || { echo "::error::'$bin --version' prints '$out', expected 'crewboard $VERSION'"; exit 1; }
          else
            echo "host is $(uname -m): the binary of $ARCH is not run"
          fi
      - name: Package
        env:
          TARGET: ${{ matrix.target }}
        run: |
          name="crewboard-$VERSION-$TARGET"
          rm -rf dist
          mkdir -p "dist/$name"
          cp "$CARGO_TARGET_DIR/$TARGET/release/crewboard" "dist/$name/"
          # The list is fixed. A missing file stops the build, so no tarball lacks a license file.
          for f in README.md LICENSE NOTICE THIRD-PARTY-LICENSES.md; do
            [ -f "$f" ] || { echo "::error::$f is missing: a tarball needs README.md, LICENSE, NOTICE and THIRD-PARTY-LICENSES.md"; exit 1; }
            cp "$f" "dist/$name/"
          done
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          tar -tzf "dist/$name.tar.gz"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bin-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error
          overwrite: true
          retention-days: 7
      - name: Clean up
        if: always()
        run: rm -rf "$CARGO_TARGET_DIR" dist

  sums:
    name: SHA256SUMS
    needs: [resolve, linux, macos]
    # A build of a push or a tag needs the macOS result: a release never lacks macOS. Only a pull
    # request skips the macOS job, and then the artifact holds the two Linux tarballs.
    if: always() && needs.linux.result == 'success' && (needs.macos.result == 'success' || (github.event_name == 'pull_request' && needs.macos.result == 'skipped'))
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          pattern: bin-*
          merge-multiple: true
      - name: Write SHA256SUMS and COMMIT
        working-directory: dist
        env:
          SHA: ${{ needs.resolve.outputs.sha }}
          VERSION: ${{ needs.resolve.outputs.version }}
          MACOS: ${{ needs.macos.result }}
        run: |
          /bin/ls -l
          # Exactly the expected tarballs: 4. Only a pull request, which skips the macOS job, has 2.
          expected="crewboard-$VERSION-aarch64-unknown-linux-gnu.tar.gz crewboard-$VERSION-x86_64-unknown-linux-gnu.tar.gz"
          if [ "$MACOS" = success ]; then
            expected="crewboard-$VERSION-aarch64-apple-darwin.tar.gz crewboard-$VERSION-x86_64-apple-darwin.tar.gz $expected"
          elif [ "$MACOS" != skipped ]; then
            echo "::error::the macOS build result is '$MACOS'"; exit 1
          fi
          # shellcheck disable=SC2086 # the names have no spaces; split on purpose
          want=$(printf '%s\n' $expected | sort)
          have=$(/bin/ls | grep -E '\.tar\.gz$' | sort)
          [ "$want" = "$have" ] || { echo "::error::expected these tarballs:"; echo "$want"; echo "found:"; echo "$have"; exit 1; }
          sha256sum crewboard-*.tar.gz > SHA256SUMS
          cat SHA256SUMS
          printf '%s\n' "$SHA" > COMMIT
          cat COMMIT
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: crewboard-build
          path: |
            dist/crewboard-*.tar.gz
            dist/SHA256SUMS
            dist/COMMIT
          if-no-files-found: error
          overwrite: true
          retention-days: 30
